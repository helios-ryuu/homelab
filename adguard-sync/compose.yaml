services:
  adguardhome-sync:
    image: ghcr.io/bakito/adguardhome-sync:latest
    container_name: adguardhome-sync
    restart: unless-stopped
    network_mode: host
    command:
      - run
      - --config
      - /app/.adguardhome-sync.yaml
    volumes:
      - ./adguardhome-sync.yaml:/app/.adguardhome-sync.yaml:ro